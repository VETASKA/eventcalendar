name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: eventcalendar}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/eventcalendar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements-dev.txt
      - run: DJANGO_SECRET_KEY=ci python manage.py makemigrations --check --dry-run
      - run: python -m pytest
