{% load static %}<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
{% block meta %}{% endblock %}
<style>

  :root { --ink:#1f1b2e; --muted:#6b6780; --line:#e7e4ef; --bg:#faf9fc; --brand:#7c3aed; --brand-soft:#f1eafe; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif; color:var(--ink); background:var(--bg);
         display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 20px; background:#fff; border-bottom:1px solid var(--line); }
  .logo { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; text-decoration:none; color:var(--ink); }
  .logo i { width:30px; height:30px; border-radius:8px; background:var(--brand); display:grid; place-items:center;
            color:#fff; font-style:normal; font-size:15px; }
  .logo small { font-weight:500; color:var(--muted); font-size:13px; }
  main { flex:1; min-height:0; padding:12px 20px 20px; display:flex; flex-direction:column; }
  #calendar { flex:1; min-height:560px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px; }
  .empty { color:var(--muted); font-size:14px; margin:8px 2px 0; }
  @media (max-width: 600px) {
    header, main { padding-left:10px; padding-right:10px; }
    .logo { font-size:16px; } .logo small { display:none; }
  }
{% block css %}{% endblock %}
</style>
</head>
<body>
<header>
  <a class="logo" href="/"><i>▦</i>{{ request.site.name }} <small>календар подій</small></a>
</header>
<main>{% block main %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
